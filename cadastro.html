<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro – horamed</title>

    <!-- Estilos: Bootstrap primeiro, depois o CSS do projeto -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- ===== MENU DE NAVEGAÇÃO ===== -->
    <nav class="navbar navbar-expand-md navbar-dark topo">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="index.html">💊 horamed</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link fs-5" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link fs-5 active fw-bold" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="sobre.html">Sobre</a></li>
                </ul>
                <button class="btn btn-warning fw-bold" id="ativarSom">🔔 Ativar alarme</button>
            </div>
        </div>
    </nav>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main>
        <section class="container py-5">
            <h1 class="fw-bold mb-4">Cadastro de remédio</h1>

            <!-- Formulário (os dias e as cores são criados pelo script.js) -->
            <form class="card card-body p-4 mb-5" id="form">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="nome">Nome do remédio</label>
                        <input class="form-control form-control-lg" id="nome" required placeholder="Ex.: Losartana">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold" for="hora">Horário</label>
                        <input class="form-control form-control-lg" type="time" id="hora" required>
                    </div>

                    <div class="col-12">
                        <span class="form-label fw-bold d-block">Dias da semana</span>
                        <div class="d-flex flex-wrap gap-2" id="dias"></div>
                    </div>

                    <div class="col-12">
                        <span class="form-label fw-bold d-block">Cor da caixinha</span>
                        <div class="d-flex flex-wrap gap-3" id="cores"></div>
                    </div>

                    <div class="col-12">
                        <button class="btn btn-success btn-lg w-100" type="submit">Salvar remédio</button>
                    </div>

                </div>
            </form>

            <!-- Lista de todos os remédios cadastrados (preenchida pelo script.js) -->
            <h2 class="h3 mb-3">Remédios cadastrados</h2>
            <div class="row g-3" id="lista"></div>
        </section>
    </main>

    <!-- ===== RODAPÉ ===== -->
    <footer class="ods py-4">
        <div class="container">
            <strong>ODS 3 – Saúde e Bem-Estar.</strong> Projeto acadêmico de ADS, 2º período.
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
